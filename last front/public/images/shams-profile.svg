<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="avatar-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <radialGradient id="mesh-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep dark canvas background -->
  <rect width="400" height="400" rx="200" fill="#020617" />
  
  <!-- Glowing ambient center -->
  <circle cx="200" cy="200" r="180" fill="url(#mesh-glow)" />

  <!-- Technical grid layout -->
  <circle cx="200" cy="200" r="150" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3" />
  <circle cx="200" cy="200" r="110" stroke="#1e293b" stroke-width="1" stroke-dasharray="5,5" />
  
  <!-- Crosshair elements -->
  <line x1="200" y1="20" x2="200" y2="380" stroke="#1e293b" stroke-width="1" stroke-opacity="0.5" />
  <line x1="20" y1="200" x2="380" y2="200" stroke="#1e293b" stroke-width="1" stroke-opacity="0.5" />

  <!-- Cybernetic Neural Path Connections -->
  <path d="M120 280 L160 220 L200 240 L240 220 L280 280" stroke="#334155" stroke-width="2" />
  <path d="M160 220 L200 130 L240 220" stroke="url(#avatar-grad)" stroke-width="2" stroke-opacity="0.4" />
  <path d="M200 130 L200 70" stroke="url(#avatar-grad)" stroke-width="1.5" stroke-dasharray="2,2" />

  <!-- Profile Silhouette / Abstract Head Contour -->
  <path d="M140 320 C140 240, 160 220, 170 200 C160 190, 150 170, 150 150 C150 110, 175 80, 200 80 C225 80, 250 110, 250 150 C250 170, 240 190, 230 200 C240 220, 260 240, 260 320" 
        stroke="url(#avatar-grad)" 
        stroke-width="4" 
        stroke-linecap="round" 
        filter="url(#neon-glow)" />

  <!-- Glowing Binary/Tech Interface Rings around Head -->
  <path d="M130 150 A70 70 0 0 1 270 150" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="8, 12" />
  
  <!-- Interactive Node points -->
  <circle cx="200" cy="80" r="5" fill="#ffffff" filter="url(#neon-glow)" />
  <circle cx="150" cy="150" r="4" fill="#22d3ee" />
  <circle cx="250" cy="150" r="4" fill="#3b82f6" />
  <circle cx="170" cy="200" r="4" fill="#6366f1" />
  <circle cx="230" cy="200" r="4" fill="#22d3ee" />
  
  <!-- Code text graphics -->
  <text x="200" y="350" fill="#475569" font-family="monospace" font-size="10" letter-spacing="4" text-anchor="middle">FOUNDER // SHAMS UD DIN</text>
  <text x="200" y="365" fill="#22d3ee" font-family="monospace" font-size="9" font-weight="bold" letter-spacing="2" text-anchor="middle">SHAMS STUDIO</text>
</svg>
