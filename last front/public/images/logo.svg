<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background Shield -->
  <rect width="100" height="100" rx="20" fill="#030712" stroke="#ffffff" stroke-opacity="0.05" />
  
  <!-- Outer Tech Grid Circle -->
  <circle cx="50" cy="50" r="40" stroke="url(#logo-grad)" stroke-opacity="0.25" stroke-dasharray="2, 4" stroke-width="1" />
  
  <!-- Glowing Futuristic Abstract 'S' -->
  <path d="M68 35 C68 28, 58 25, 50 25 C38 25, 32 30, 32 38 C32 50, 68 45, 68 58 C68 68, 56 75, 48 75 C34 75, 32 68, 32 62" 
        stroke="url(#logo-grad)" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />
        
  <!-- Core Energy Nodes -->
  <circle cx="68" cy="35" r="3" fill="#22d3ee" />
  <circle cx="32" cy="62" r="3" fill="#2563eb" />
  <circle cx="50" cy="48" r="2.5" fill="#ffffff" />
</svg>
