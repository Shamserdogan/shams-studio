<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="p4-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <radialGradient id="bg-glow-4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4d074e" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#bg-glow-4)" />

  <!-- Alignment Grids -->
  <g opacity="0.15" stroke="#ffffff" stroke-width="0.5">
    <line x1="50" y1="50" x2="750" y2="400" />
    <line x1="750" y1="50" x2="50" y2="400" />
    <rect x="100" y="50" width="600" height="350" />
    <rect x="200" y="100" width="400" height="250" />
  </g>

  <!-- Golden Ratio Spirals & Circles (Mathematical layout structure) -->
  <g stroke="url(#p4-grad)" stroke-width="1.5">
    <circle cx="400" cy="225" r="144" stroke-opacity="0.2" />
    <circle cx="400" cy="225" r="89" stroke-opacity="0.4" />
    <circle cx="400" cy="225" r="55" stroke-opacity="0.6" />
    <circle cx="400" cy="225" r="34" stroke-opacity="0.8" />
    <circle cx="400" cy="225" r="21" />
    
    <!-- Fibonacci Arc curves -->
    <path d="M400 369 A144 144 0 0 1 256 225 A89 89 0 0 1 345 136 A55 55 0 0 1 400 191" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Swiss Design Layout Elements (Blocks and Texts) -->
  <!-- Brand logo prototype 'C' -->
  <g transform="translate(180, 225)">
    <path d="M 30 -50 A 60 60 0 1 0 30 50" fill="none" stroke="url(#p4-grad)" stroke-width="16" stroke-linecap="round" />
    <circle cx="30" cy="-50" r="8" fill="#ffffff" />
    <circle cx="30" cy="50" r="8" fill="#ffffff" />
  </g>

  <!-- Typography Specs Block -->
  <g transform="translate(520, 140)">
    <text x="0" y="0" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="42" letter-spacing="-2">CHRONOS</text>
    <text x="0" y="30" fill="#ec4899" font-family="monospace" font-size="11" letter-spacing="4" font-weight="bold">CYBERNETIC SYSTEM</text>
    <text x="0" y="65" fill="#94a3b8" font-family="sans-serif" font-size="13" leading="18">TYPEFACE: SPACE GROTESK</text>
    <text x="0" y="85" fill="#64748b" font-family="sans-serif" font-size="11">RATIO: 1.618 (GOLDEN STANDARD)</text>
    
    <!-- Color Swatches Matrix -->
    <g transform="translate(0, 110)">
      <rect x="0" y="0" width="24" height="24" rx="4" fill="#ec4899" />
      <rect x="32" y="0" width="24" height="24" rx="4" fill="#d946ef" />
      <rect x="64" y="0" width="24" height="24" rx="4" fill="#3b82f6" />
      <rect x="96" y="0" width="24" height="24" rx="4" fill="#030712" stroke="#ffffff" stroke-opacity="0.1" />
    </g>
  </g>

  <!-- Tech details labels -->
  <text x="100" y="380" fill="#64748b" font-family="monospace" font-size="10">GRID_ALIGN: TRUE</text>
  <text x="700" y="380" fill="#64748b" font-family="monospace" font-size="10" text-anchor="end">BOOK_OF_STANDARDS_v1.0</text>
</svg>
