<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="p2-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <radialGradient id="bg-glow-2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#bg-glow-2)" />
  
  <!-- Outer Browser Frame -->
  <rect x="50" y="50" width="700" height="350" rx="12" fill="#030712" stroke="#3b82f6" stroke-width="2" stroke-opacity="0.3" />
  
  <!-- Browser Circles / Dots (Traffic lights) -->
  <circle cx="80" cy="75" r="6" fill="#ef4444" />
  <circle cx="100" cy="75" r="6" fill="#eab308" />
  <circle cx="120" cy="75" r="6" fill="#22c55e" />
  <rect x="150" y="65" width="400" height="20" rx="6" fill="#1e293b" stroke="#ffffff" stroke-opacity="0.05" />
  <text x="350" y="79" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">https://shams-studio.com/portal</text>

  <!-- Code Graphics on Left Panel -->
  <g transform="translate(80, 120)">
    <text x="0" y="20" fill="#6366f1" font-family="monospace" font-size="14" font-weight="bold">const</text>
    <text x="50" y="20" fill="#22d3ee" font-family="monospace" font-size="14" font-weight="bold">App = () =&gt; {</text>
    <text x="20" y="50" fill="#64748b" font-family="monospace" font-size="14">  const [loading, setLoading] = useState(false);</text>
    <text x="20" y="80" fill="#e2e8f0" font-family="monospace" font-size="14">  return (</text>
    <text x="40" y="110" fill="#f43f5e" font-family="monospace" font-size="14">&lt;div</text>
    <text x="80" y="110" fill="#eab308" font-family="monospace" font-size="14">className="portal-frame"</text>
    <text x="235" y="110" fill="#f43f5e" font-family="monospace" font-size="14">&gt;</text>
    <text x="60" y="140" fill="#22c55e" font-family="monospace" font-size="14">&lt;NeuralCore secure={true} /&gt;</text>
    <text x="40" y="170" fill="#f43f5e" font-family="monospace" font-size="14">&lt;/div&gt;</text>
    <text x="20" y="200" fill="#e2e8f0" font-family="monospace" font-size="14">  );</text>
    <text x="0" y="230" fill="#22d3ee" font-family="monospace" font-size="14">};</text>
  </g>

  <!-- Visual Mock Interface elements on Right Panel -->
  <g transform="translate(480, 120)">
    <!-- Main stats block -->
    <rect width="220" height="150" rx="10" fill="#0b0f19" stroke="#6366f1" stroke-opacity="0.3" stroke-width="1.5" />
    <text x="20" y="30" fill="#94a3b8" font-family="sans-serif" font-weight="600" font-size="12">SPEED PERFORMANCE</text>
    <text x="20" y="70" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="36">99.8%</text>
    
    <!-- Render Line graphs inside the card -->
    <path d="M20 120 L60 100 L100 130 L140 90 L180 110 L200 95" stroke="url(#p2-grad)" stroke-width="3" stroke-linecap="round" />
    <circle cx="200" cy="95" r="4" fill="#ffffff" />
    <circle cx="200" cy="95" r="8" stroke="#22d3ee" stroke-width="1.5" />

    <!-- React Vector badge floating -->
    <g transform="translate(140, 170)">
      <ellipse cx="40" cy="40" rx="35" ry="12" stroke="#22d3ee" stroke-width="1.5" fill="none" transform="rotate(30, 40, 40)" opacity="0.6" />
      <ellipse cx="40" cy="40" rx="35" ry="12" stroke="#22d3ee" stroke-width="1.5" fill="none" transform="rotate(90, 40, 40)" opacity="0.6" />
      <ellipse cx="40" cy="40" rx="35" ry="12" stroke="#22d3ee" stroke-width="1.5" fill="none" transform="rotate(150, 40, 40)" opacity="0.6" />
      <circle cx="40" cy="40" r="4" fill="#22d3ee" />
    </g>
  </g>

  <text x="400" y="380" fill="#64748b" font-family="monospace" font-size="11" letter-spacing="4" text-anchor="middle">TSX // SECURE_COMPILING_ACTIVE</text>
</svg>
