<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="p3-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <radialGradient id="bg-glow-3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <filter id="p3-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#bg-glow-3)" />

  <!-- Dotted flow lattice background -->
  <g opacity="0.15">
    <circle cx="100" cy="100" r="1.5" fill="#ffffff" />
    <circle cx="200" cy="100" r="1.5" fill="#ffffff" />
    <circle cx="300" cy="100" r="1.5" fill="#ffffff" />
    <circle cx="400" cy="100" r="1.5" fill="#ffffff" />
    <circle cx="500" cy="100" r="1.5" fill="#ffffff" />
    <circle cx="600" cy="100" r="1.5" fill="#ffffff" />
    <circle cx="700" cy="100" r="1.5" fill="#ffffff" />

    <circle cx="100" cy="225" r="1.5" fill="#ffffff" />
    <circle cx="200" cy="225" r="1.5" fill="#ffffff" />
    <circle cx="300" cy="225" r="1.5" fill="#ffffff" />
    <circle cx="400" cy="225" r="1.5" fill="#ffffff" />
    <circle cx="500" cy="225" r="1.5" fill="#ffffff" />
    <circle cx="600" cy="225" r="1.5" fill="#ffffff" />
    <circle cx="700" cy="225" r="1.5" fill="#ffffff" />

    <circle cx="100" cy="350" r="1.5" fill="#ffffff" />
    <circle cx="200" cy="350" r="1.5" fill="#ffffff" />
    <circle cx="300" cy="350" r="1.5" fill="#ffffff" />
    <circle cx="400" cy="350" r="1.5" fill="#ffffff" />
    <circle cx="500" cy="350" r="1.5" fill="#ffffff" />
    <circle cx="600" cy="350" r="1.5" fill="#ffffff" />
    <circle cx="700" cy="350" r="1.5" fill="#ffffff" />
  </g>

  <!-- Flow pipelines / nodes connecting together -->
  <g stroke="url(#p3-grad)" stroke-width="2">
    <!-- Main input line -->
    <path d="M50 225 L180 225 M180 225 L280 130 M180 225 L280 320 M280 130 L450 130 M280 320 L450 320 M450 130 L580 225 M450 320 L580 225 M580 225 L750 225" stroke-dasharray="4,4" />
    
    <!-- Flow indicators -->
    <path d="M120 225 L140 225 M320 130 L360 130 M320 320 L360 320 M630 225 L670 225" stroke="#ffffff" stroke-width="3" filter="url(#p3-glow)" />
  </g>

  <!-- Neural Node Circles with detailed HUD metrics -->
  <!-- Node 1: Unified Brief Input -->
  <g transform="translate(180, 225)">
    <circle cx="0" cy="0" r="28" fill="#020617" stroke="#a855f7" stroke-width="3" />
    <polygon points="-6,-8 10,0 -6,8" fill="#ffffff" />
    <text x="0" y="45" fill="#a855f7" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">BRIEF_IN</text>
  </g>

  <!-- Node 2: Prompt Engineering -->
  <g transform="translate(280, 130)">
    <circle cx="0" cy="0" r="24" fill="#020617" stroke="#3b82f6" stroke-width="2.5" />
    <circle cx="0" cy="0" r="12" fill="url(#p3-grad)" />
    <text x="0" y="40" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">PROMPT_ENG</text>
  </g>

  <!-- Node 3: LLM Parsing -->
  <g transform="translate(280, 320)">
    <circle cx="0" cy="0" r="24" fill="#020617" stroke="#3b82f6" stroke-width="2.5" />
    <circle cx="0" cy="0" r="12" fill="none" stroke="#22d3ee" stroke-width="2" />
    <text x="0" y="40" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">LLM_PARSE</text>
  </g>

  <!-- Node 4: Synthesis -->
  <g transform="translate(450, 130)">
    <circle cx="0" cy="0" r="24" fill="#020617" stroke="#3b82f6" stroke-width="2.5" />
    <rect x="-8" y="-8" width="16" height="16" fill="#a855f7" />
    <text x="0" y="40" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">SYNTH_CORE</text>
  </g>

  <!-- Node 5: Output Generation -->
  <g transform="translate(450, 320)">
    <circle cx="0" cy="0" r="24" fill="#020617" stroke="#3b82f6" stroke-width="2.5" />
    <polygon points="0,-10 10,8 -10,8" fill="#22d3ee" />
    <text x="0" y="40" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">GEN_OUT</text>
  </g>

  <!-- Node 6: Central Core Agent (Interactions Engine) -->
  <g transform="translate(580, 225)">
    <circle cx="0" cy="0" r="32" fill="#020617" stroke="#a855f7" stroke-width="4" filter="url(#p3-glow)" />
    <circle cx="0" cy="0" r="18" fill="#ffffff" />
    <polygon points="-4,-6 8,0 -4,6" fill="#020617" />
    <text x="0" y="48" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">OMNIFLOW</text>
  </g>

  <!-- Technical Overlay HUD text -->
  <text x="400" y="70" fill="#e2e8f0" font-family="monospace" font-size="16" font-weight="bold" letter-spacing="4" text-anchor="middle">OMNIFLOW AUTONOMOUS PIPELINE</text>
</svg>
