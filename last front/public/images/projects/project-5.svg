<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="p5-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <radialGradient id="bg-glow-5" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#bg-glow-5)" />

  <!-- Technical WAN background lines -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="1">
    <circle cx="400" cy="225" r="200" stroke-dasharray="6,6" />
    <circle cx="400" cy="225" r="140" stroke-dasharray="4,4" />
    <circle cx="400" cy="225" r="80" stroke-dasharray="2,2" />
  </g>

  <!-- Core Router Nodes -->
  <!-- Router 1: WAN Edge (Left) -->
  <g transform="translate(220, 225)">
    <circle cx="0" cy="0" r="36" fill="#020617" stroke="#10b981" stroke-width="3" />
    <!-- Router Arrows (Cisco symbol style) -->
    <path d="M-20 -8 H20 M20 -8 L14 -14 M20 -8 L14 -2 M-20 8 H20 M-20 8 L-14 2 M-20 8 L-14 14" stroke="#10b981" stroke-width="2.5" />
    <text x="0" y="55" fill="#10b981" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">ROUTER_01_EDGE</text>
    <text x="0" y="70" fill="#64748b" font-family="monospace" font-size="9" text-anchor="middle">IP: 192.168.10.1</text>
  </g>

  <!-- Router 2: WAN Core (Right) -->
  <g transform="translate(580, 225)">
    <circle cx="0" cy="0" r="36" fill="#020617" stroke="#06b6d4" stroke-width="3" />
    <!-- Router Arrows (Cisco symbol style) -->
    <path d="M-20 -8 H20 M-20 -8 L-14 -14 M-20 -8 L-14 -2 M-20 8 H20 M20 8 L14 2 M20 8 L14 14" stroke="#06b6d4" stroke-width="2.5" />
    <text x="0" y="55" fill="#06b6d4" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">ROUTER_02_CORE</text>
    <text x="0" y="70" fill="#64748b" font-family="monospace" font-size="9" text-anchor="middle">IP: 10.0.0.1</text>
  </g>

  <!-- Stateful Connection WAN Trunk Link -->
  <g stroke="url(#p5-grad)" stroke-width="3">
    <path d="M256 225 C300 170, 500 170, 544 225" />
    <path d="M256 225 C300 280, 500 280, 544 225" stroke-dasharray="6,6" stroke-opacity="0.6" />
  </g>

  <!-- Link Status HUD box in Center -->
  <g transform="translate(400, 150)">
    <rect x="-70" y="-15" width="140" height="30" rx="6" fill="#030712" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5" />
    <text x="0" y="4" fill="#34d399" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">OSPF_AREA_0 // ACTIVE</text>
  </g>

  <g transform="translate(400, 300)">
    <rect x="-60" y="-15" width="120" height="30" rx="6" fill="#030712" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1.5" />
    <text x="0" y="4" fill="#22d3ee" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">TRUNK_VLAN_99</text>
  </g>

  <!-- Technical specs legend inside background -->
  <g transform="translate(50, 60)">
    <text x="0" y="0" fill="#e2e8f0" font-family="monospace" font-size="15" font-weight="bold" letter-spacing="2">TITAN WAN TOPOLOGY</text>
    <text x="0" y="20" fill="#64748b" font-family="monospace" font-size="9" letter-spacing="1">METRICS: Dual-Core ACL / Switches Enabled</text>
  </g>

  <g transform="translate(50, 380)">
    <text x="0" y="0" fill="#10b981" font-family="monospace" font-size="10" font-weight="bold">● SUB_A: 192.168.10.0 /24</text>
    <text x="0" y="15" fill="#06b6d4" font-family="monospace" font-size="10" font-weight="bold">● SUB_B: 10.0.0.0 /30</text>
  </g>
</svg>
